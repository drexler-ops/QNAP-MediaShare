# Photo Audit — the permanent stack that runs on the NAS (or any Docker host that can see the media).
#
#   docker compose up -d --build
#
# All deployment-specific settings live in .env (copy .env.example). See README "Configuration".
name: photo-audit

x-app-env: &app-env
  DB_HOST: db
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  LIBRARY_ROOT: /library
  THUMBS_ROOT: /thumbs
  QUARANTINE_DIRNAME: ${QUARANTINE_DIRNAME:-.quarantine}
  MODELS_ROOT: /models
  TZ: ${TZ:-UTC}
  UMASK: ${UMASK:-000}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: photoaudit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: photoaudit
    command: ["postgres", "-c", "shared_buffers=${DB_SHARED_BUFFERS:-512MB}", "-c", "max_connections=60"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # LAN access for the optional helper-PC worker during the initial scan. Remove afterwards if you like.
      - "${DB_PUBLISH_PORT:-5432}:5432"
    mem_limit: ${DB_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoaudit -d photoaudit"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: { context: ., target: runtime }
    image: photo-audit:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *app-env
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_NAME: ${APP_NAME:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
      PUBLIC_SHARE_URL: ${PUBLIC_SHARE_URL:-}
      RUN_MIGRATIONS: "true"
      # Optional extra volume shown (free space only) in Settings -> NAS resources
      EXTRA_VOLUME: ${EXTRA_VOLUME_PATH:-}
      EXTRA_VOLUME_LABEL: ${EXTRA_VOLUME_LABEL:-}
    volumes:
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library
      - ${THUMBS_PATH:?set THUMBS_PATH in .env}:/thumbs
      - models:/models:ro
      # Read-only, used only to report free space. Unset: falls back to the thumbs folder (same volume, no extra row).
      - ${EXTRA_VOLUME_PATH:-${THUMBS_PATH}}:/volumes/extra:ro
    ports:
      - "${APP_PORT:-8090}:8080"
    mem_limit: ${API_MEM_LIMIT:-1g}

  worker:
    image: photo-audit:latest
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
    environment:
      <<: *app-env
      WORKER_NAME: nas
      WORKER_CONCURRENCY: ${NAS_WORKER_CONCURRENCY:-2}
      FACE_THREADS: ${FACE_THREADS:-2}
      SCHEDULER_ENABLED: "true"
    volumes:
      - ${LIBRARY_PATH}:/library
      - ${THUMBS_PATH}:/thumbs
      # Face recognition models (downloaded on first use, ~190 MB)
      - models:/models
    mem_limit: ${WORKER_MEM_LIMIT:-2g}

  # Nightly database snapshots (pg_dump) for the NAS backup job to pick up: see INSTALL.md "Backups".
  # DB_BACKUP_PATH must be OUTSIDE the app folder (that folder is replaced on every update).
  dbbackup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-UTC}
      DB_BACKUP_TIME: ${DB_BACKUP_TIME:-01:30}
      DB_BACKUP_KEEP: ${DB_BACKUP_KEEP:-14}
    volumes:
      - ./deploy/dbbackup/backup.sh:/backup.sh:ro
      - ${DB_BACKUP_PATH:-../backups}:/backups
    mem_limit: 256m

  # Optional public share-link service (COMPOSE_PROFILES=public). Same image in share-only mode:
  # serves ONLY /s/<token> album pages and their media; no sign-in, no API, no other pages.
  # This is the only thing that should ever face the internet.
  # Sidecar layout (Tailscale's standard Docker pattern): it runs inside the tailscale-share
  # container's network namespace, so Funnel forwards to 127.0.0.1:8080.
  share:
    image: photo-audit:latest
    profiles: ["public"]
    restart: unless-stopped
    network_mode: service:tailscale-share
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
      # If the Tailscale container is recreated, this one must be too (it shares its network).
      tailscale-share: { condition: service_started, restart: true }
    environment:
      <<: *app-env
      SECRET_KEY: ${SECRET_KEY}
      APP_NAME: ${APP_NAME:-}
      SHARE_ONLY: "true"
      SKIP_INIT_DB: "1"
      # Only the Funnel proxy (and localhost) can reach this service, so trust its
      # X-Forwarded-For: the real visitor IP is needed for password-attempt rate limiting.
      FORWARDED_ALLOW_IPS: "*"
      # Exit (and get restarted by Docker) if the Tailscale container restarts on its own and
      # leaves this one on a dead network namespace.
      NETNS_WATCHDOG: "1"
    volumes:
      - ${LIBRARY_PATH}:/library:ro
      - ${THUMBS_PATH}:/thumbs
    mem_limit: ${SHARE_MEM_LIMIT:-512m}

  # Optional private remote access for app users (family) via Tailscale. Enable with
  # COMPOSE_PROFILES=remote and TS_AUTHKEY in .env. Exposes ONLY this app (HTTPS, inside your
  # tailnet): no router ports, and tailnet devices can't reach QTS, file shares or anything else.
  tailscale:
    image: tailscale/tailscale:v1.88.3
    profiles: ["remote"]
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-photo-audit}
    depends_on:
      api: { condition: service_started }
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-photo-audit}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      - ./deploy/tailscale/serve-app.json:/config/serve.json:ro
    mem_limit: 256m

  # Optional PUBLIC share links via Tailscale Funnel (COMPOSE_PROFILES=...,public and TS_SHARE_AUTHKEY).
  # A separate Tailscale machine that publishes ONLY the share-only service (its sidecar) to the
  # internet at https://<TS_SHARE_HOSTNAME>.<tailnet>.ts.net. The main app is never reachable through it.
  tailscale-share:
    image: tailscale/tailscale:v1.88.3
    profiles: ["public"]
    restart: unless-stopped
    hostname: ${TS_SHARE_HOSTNAME:-photo-share}
    environment:
      TS_AUTHKEY: ${TS_SHARE_AUTHKEY:-}
      TS_HOSTNAME: ${TS_SHARE_HOSTNAME:-photo-share}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsshare-state:/var/lib/tailscale
      - ./deploy/tailscale/serve-share.json:/config/serve.json:ro
    ports:
      # Local testing of the share-only service only; the public route is Funnel (no port needed).
      - "${SHARE_PUBLISH:-127.0.0.1:8091}:8080"
    mem_limit: 256m

volumes:
  pgdata:
  tsstate:
  tsshare-state:
  models:
